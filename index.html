<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Happy Days"><meta name="theme-color" content="#f7f5ef">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5ef;--card:rgba(255,255,255,.72);--ink:#37474f;--mut:#5f7279;--line:#b7cbcd;--acc:#2f6e76;--on:#fff;--acc2:#e8c66a;--ok:#5f8f5a;--w1:rgba(140,195,215,.5);--w2:rgba(225,170,195,.38);--w3:rgba(165,208,170,.5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c262b;--card:rgba(38,52,60,.8);--ink:#e6eef0;--mut:#a9bcc2;--line:#44606a;--acc:#86c8d0;--on:#13242a;--acc2:#d8b85a;--ok:#9cc79a;--w1:rgba(70,120,145,.35);--w2:rgba(130,90,120,.25);--w3:rgba(80,130,100,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c262b;--card:rgba(38,52,60,.8);--ink:#e6eef0;--mut:#a9bcc2;--line:#44606a;--acc:#86c8d0;--on:#13242a;--acc2:#d8b85a;--ok:#9cc79a;--w1:rgba(70,120,145,.35);--w2:rgba(130,90,120,.25);--w3:rgba(80,130,100,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 8% 4%,var(--w1),transparent 55%),radial-gradient(ellipse at 96% 22%,var(--w2),transparent 48%),radial-gradient(ellipse at 15% 62%,var(--w3),transparent 50%),radial-gradient(ellipse at 92% 90%,var(--w1),transparent 50%),radial-gradient(ellipse at 40% 100%,var(--w2),transparent 45%),var(--bg);background-attachment:fixed;color:var(--ink);font:18px/1.35 'Patrick Hand','Segoe Print','Comic Sans MS',cursive}
#app{max-width:640px;margin:0 auto;padding:12px 14px 60px}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;font:700 36px 'Caveat','Patrick Hand',cursive;padding:0}
.btn,.add button{background:var(--acc);color:var(--on);border:0;border-radius:16px 11px 15px 10px;padding:6px 14px;box-shadow:0 2px 7px rgba(50,90,100,.3)}
.sub{color:var(--mut);margin:4px 0 14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:24px 17px 22px 16px/17px 24px 16px 22px;padding:12px;margin:12px 0;box-shadow:0 5px 18px rgba(70,110,125,.2);backdrop-filter:blur(2px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0;text-align:center}
.grid b{font:700 26px 'Caveat',cursive}
.row{display:block;width:100%;text-align:left}
.row b{font-size:21px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
label{display:block;margin:6px 0;color:var(--mut)}
label input{display:block;width:100%;color:var(--ink)}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.add input{flex:1 1 120px}
.back{background:none;border:0;color:var(--acc);padding:4px 0;font-size:20px}
.ch{display:flex;align-items:center;gap:10px}
.ch h2{font:700 38px 'Caveat',cursive;margin:0}
.sm{font-size:.62em;font-weight:700}.grid .sm{display:block;line-height:1}.grid .card svg,.ch svg{flex-shrink:0}
.title{flex:1;font:700 34px 'Caveat',cursive;background:none;border:0;border-bottom:2px dashed var(--line);border-radius:0;width:100%}
summary{font:700 28px 'Caveat',cursive;cursor:pointer}
h4{margin:12px 0 2px;color:var(--acc)}
small{color:var(--mut);font-size:.8em}
ul{list-style:none;margin:4px 0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
li span{flex:1}
li.done span{text-decoration:line-through;opacity:.6}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok)}
.x{background:none;border:0;color:var(--mut);font-size:24px;padding:0 6px}
.gb{margin:10px 0;padding:6px 12px 10px;border:2px dashed var(--line);border-radius:16px}.gb h4{font:700 26px 'Caveat',cursive;margin:4px 0}.gc{display:inline-block;min-width:26px;padding:0 8px;border-radius:13px;background:var(--acc);color:var(--on);font:700 17px system-ui,sans-serif;text-align:center}.gt{margin:8px 0 2px}.gt b{font:700 24px 'Caveat',cursive}
.meal{position:relative;border:2px dashed var(--line);border-radius:12px;padding:8px 34px 8px 10px;margin:6px 0}
.meal .x{position:absolute;right:2px;top:4px}
.meal p{margin:4px 0 0}
.tod{border-color:var(--acc2);background:rgba(246,196,83,.15)}
.lk{margin-top:14px;padding-top:6px;border-top:2px dotted var(--line)}
.lr{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
a{color:var(--acc)}
.del{background:none;border:2px dashed var(--mut);border-radius:12px;padding:8px 14px;color:var(--mut);margin-top:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.nav b{font:700 30px 'Caveat',cursive}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center;color:var(--mut);font-size:14px}
.day{min-height:58px;border:1px solid var(--line);border-radius:8px;padding:2px;font-size:13px;overflow:hidden}
.chip{display:block;width:100%;font-size:10px;line-height:1.2;border:0;border-radius:6px;color:#fff;padding:1px 3px;margin-top:2px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ev>div{flex:1}
.x{min-width:40px;min-height:40px}
.late small{color:#c0504d;font-weight:700}

const C={away:{n:'Weekends away<span class="sm"> and Holidays</span>',col:'#4a7d9c',ph:'e.g. Cottage weekend'},birthday:{n:'Birthdays',col:'#8a5a96',ph:'e.g. Birthday party'},christmas:{n:'Christmas',col:'#3f7550',ph:'e.g. Christmas 2026'},special:{n:'Special occasions',col:'#8a7a2a',ph:'e.g. Anniversary dinner'}};

const hdr=()=>`<header><button class="logo" data-a="go" data-p="home" style="color:var(--ink)">${ic('smile',46)}<span>Happy Days</span></button><button class="btn" data-a="go" data-p="cal">📅 Calendar</button></header>`;
const nxt=()=>{const t=iso(new Date()),l=S.ev.filter(e=>e.f.date&&e.f.date>=t).sort((a,b)=>a.f.date.localeCompare(b.f.date))[0];if(!l)return'';const n=Math.round((D(l.f.date)-D(t))/864e5);return `<button class="card row" data-a="go" data-p="ev" data-id="${l.id}" style="display:flex;align-items:center;gap:10px;margin:0 0 12px">${ic(l.cat,40)}<span><small>Coming up next</small><br><b>${esc(l.name)}</b> · ${n?`in ${n} day${n>1?'s':''}`:'today!'}</span></button>`};
const bkp=`<details class="card"><summary>Backup &amp; restore</summary><p class="sub">Your plans are saved on this device only. Make a backup now and then and keep it somewhere safe, like Notes.</p><textarea id="bkt" rows="4" style="width:100%" placeholder="Your backup appears here, or paste one to restore"></textarea><div class="add"><button data-a="bk">Make backup</button><button data-a="rs">Restore from box</button></div><small id="bkm"></small></details>`;
const home=()=>`<p class="sub">Plan every happy day, big and small.</p>${nxt()}<div class="grid">${Object.entries(C).map(([k,c])=>`<button class="card" data-a="go" data-p="cat" data-c="${k}">${ic(k,84)}<b>${c.n}</b><small>${S.ev.filter(e=>e.cat==k).length} planned</small></button>`).join('')}</div>${bkp}`;
const prog=e=>{const t=(e.s.todo||{}).items||[],n=((e.s.events||{}).items||[]).length;return (t.length?`${t.filter(i=>i.d).length}/${t.length} to-dos done`:'no to-dos yet')+(n?` · ${n} event${n>1?'s':''}`:'')};
function catp(){const c=C[V.c],l=S.ev.filter(e=>e.cat==V.c).sort((a,b)=>(a.f.date||'9').localeCompare(b.f.date||'9'));
return `<button class="back" data-a="go" data-p="home">← Back</button><div class="ch">${ic(V.c,70)}<h2>${c.n}</h2></div>${l.map(e=>`<button class="card row" data-a="go" data-p="ev" data-id="${e.id}"><b>${esc(e.name)}</b><br><small>${e.f.date?fd(e.f.date):'No date yet'} · ${prog(e)}</small></button>`).join('')||'<p class="sub">Nothing here yet. Tap the button below to add your first.</p>'}<button class="btn" data-a="newev" style="width:100%;margin-top:6px;font-size:22px;padding:10px 14px">+ Add another ${AD[V.c]}</button>`}
const wxh=e=>'https://www.google.com/search?q='+encodeURIComponent('weather '+(e.f.place||''));
function evp(e){return `<button class="back" data-a="go" data-p="cat" data-c="${e.cat}">← ${C[e.cat].n}</button><div class="ch">${ic(e.cat,56)}<input class="title" data-name value="${esc(e.name)}" aria-label="Name"></div>${SEC[e.cat].map(s=>sec(e,s)).join('')}<button class="del" data-a="dup" style="margin-right:8px">Duplicate</button><button class="del" data-a="delev">${V.del?'Tap again to delete':'Delete this plan'}</button>`}
function sec(e,[id,t,ty]){const k=e.id+id,o=e.s[id]=e.s[id]||{items:[],links:[]},it=o.items;let b='';
const li=(x,i,tick)=>`<li class="${x.d?'done':x.when&&x.when<iso(new Date())?'late':''}">${tick?`<input type="checkbox" data-a="tick" data-i="${i}" ${x.d?'checked':''}>`:''}<span>${esc(x.t)}${x.when?` <small>${fs(x.when)}</small>`:''}</span><button class="x" data-a="del" data-i="${i}" aria-label="Remove">×</button></li>`;
if(ty=='fields'){b=FL[e.cat].map(([f,l,tp])=>`<label>${l}<input data-f="${f}" type="${tp||'text'}" value="${esc(e.f[f])}"></label>`).join('')+`<a id="wx" href="${wxh(e)}" target="_blank" rel="noopener">See the forecast ↗</a>`}
else{
if(ty=='guests'){const G=[['Kids'],['Adults']],c=g=>it.filter(x=>x.g==g).length;b=G.map(([g])=>`<div class="gb"><h4>${g} <span class="gc">${c(g)}</span></h4><ul>${it.map((x,i)=>x.g==g?`<li><span>${esc(x.t)}</span><button class="x" data-a="del" data-i="${i}" aria-label="Remove">×</button></li>`:'').join('')}</ul><div class="add" data-g="${g}"><input type="hidden" name="g" value="${g}"><input name="t" placeholder="Type a name, press Return" autocomplete="off" autocapitalize="words" enterkeyhint="next"><button data-a="add">Add</button></div></div>`).join('')+`<p class="gt"><b>Total: ${it.length}</b> <small>${c('Kids')} kids · ${c('Adults')} adults</small></p>`}
else if(ty=='pack')b=GR.map(g=>`<h4>${g}</h4><ul>${it.map((x,i)=>x.w==g?li(x,i,1):'').join('')}</ul>`).join('');
else if(ty=='meal'&&id=='food')b=`<ul>${it.map((x,i)=>`<li><span><b>${esc(x.t)}</b> <small>${x.ty||''}</small>${x.ing?`<br><small>🛒 ${esc(x.ing)}</small>`:''}</span><button class="x" data-a="del" data-i="${i}" aria-label="Remove">×</button></li>`).join('')}</ul>`;
else if(ty=='meal')b=it.map((x,i)=>`<div class="meal ${/^Toddler/.test(x.ty)?'tod':''}"><b>${esc(x.t)}</b> <small>${x.ty}</small>${x.ing?`<p>🛒 ${esc(x.ing)}</p>`:''}<button class="x" data-a="del" data-i="${i}" aria-label="Remove">×</button></div>`).join('');
else if(ty=='events')b=`<ul>${it.map((x,i)=>`<li><span><b>${esc(x.t)}</b> <small>${esc(x.k)}${x.date?' · '+fs(x.date)+(x.end&&x.end>x.date?' – '+fs(x.end):''):''}</small></span><button class="x" data-a="del" data-i="${i}" aria-label="Remove">×</button></li>`).join('')}</ul>`;
else if(ty=='notes')b=`<textarea data-n="${id}" rows="6" style="width:100%" placeholder="Anything to remember…">${esc(o.text||'')}</textarea>`;
else b=`<ul>${it.map((x,i)=>li(x,i,ty=='check')).join('')}</ul>`;
const sel=(n,a)=>`<select name="${n}">${a.map(g=>`<option>${g}</option>`).join('')}</select>`;
if(ty=='meal'&&it.some(x=>x.ing)){const s=[...new Set(it.flatMap(x=>(x.ing||'').split(',').map(v=>v.trim().toLowerCase()).filter(Boolean)))];b+=`<p>🛒 <b>Shopping list:</b> ${esc(s.join(', '))}</p>`}
if(ty!='notes'&&ty!='guests')b+=`<div class="add">${ty=='pack'?sel('w',GR):ty=='meal'?sel('ty',TY):ty=='events'?sel('k',KL):ty=='guests'?sel('g',['Kids','Adults']):''}<input name="t" placeholder="${ty=='meal'?'Meal or snack':ty=='events'?'Event name':ty=='check'?'Add a task…':ty=='guests'?'Name':'Add…'}">${ty=='meal'?'<input name="ing" placeholder="Ingredients (comma separated)">':''}${ty=='events'?'<label style="flex:1 1 130px;margin:0"><small>Starts</small><input name="date" type="date"></label><label style="flex:1 1 130px;margin:0"><small>Ends (optional, for several days)</small><input name="end" type="date"></label>':''}${ty=='check'?'<input name="when" type="date" title="Do by">':''}<button data-a="add">Add</button></div>`}
if(ty!='guests')b+=`<div class="lk"><h4>🔗 Links <small>accommodation, shopping, ideas</small></h4>${o.links.map((l,i)=>`<div class="lr"><a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.l||l.u)} ↗</a><button class="x" data-a="dellink" data-i="${i}" aria-label="Remove link">×</button></div>`).join('')}<div class="add"><input name="l" placeholder="Label"><input name="u" placeholder="Paste a link"><button data-a="addlink">Add</button></div></div>`;
const n=ty=='guests'&&it.length?` <small>${it.length}</small>`:(ty=='check'||ty=='pack')&&it.length?` <small>${it.filter(x=>x.d).length}/${it.length}</small>`:'';
return `<details class="card" data-k="${k}" data-s="${id}" ${open[k]!==undefined?(open[k]?'open':''):id=='details'?'open':''}><summary>${t}${n}</summary>${b}</details>`}

const cd=d=>iso(d).replace(/-/g,'');
const gsub=x=>{const s=D(x.date),f=new Date(s.getFullYear(),s.getMonth(),s.getDate()+sn(x));return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.name+' ('+x.par+')')+'&dates='+cd(s)+'/'+cd(f)+'&details='+encodeURIComponent('Planned in Happy Days')};
const nd=e=>Math.max(1,+e.f.days||1);
function gcal(e){const s=D(e.f.date),f=new Date(s.getFullYear(),s.getMonth(),s.getDate()+nd(e));return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.name)}&dates=${cd(s)}/${cd(f)}&location=${encodeURIComponent(e.f.place||'')}&details=${encodeURIComponent('Planned in Happy Days')}`}
function cal(){const m=V.m||(V.m=new Date(new Date().getFullYear(),new Date().getMonth(),1));
const y=m.getFullYear(),mo=m.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),map={};
const dated=S.ev.filter(e=>e.f.date).sort((a,b)=>a.f.date.localeCompare(b.f.date));
dated.forEach(e=>{const s=D(e.f.date);for(let i=0;i<nd(e);i++){const k=iso(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i));(map[k]=map[k]||[]).push(e)}});
const sb=subs();sb.forEach(x=>{const s=D(x.date);for(let i=0;i<sn(x);i++){const k=iso(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i));(map[k]=map[k]||[]).push(x)}});
const rows=[...dated.map(e=>({id:e.id,cat:e.cat,name:e.name,date:e.f.date,g:gcal(e)})),...sb.map(x=>({...x,g:gsub(x)}))].sort((a,b)=>a.date.localeCompare(b.date));
let c='';for(let i=0;i<first;i++)c+='<div></div>';
for(let d=1;d<=days;d++)c+=`<div class="day" ${iso(new Date(y,mo,d))==iso(new Date())?'style="border:2px solid var(--acc);background:rgba(246,196,83,.18)"':''}>${d}${(map[iso(new Date(y,mo,d))]||[]).map(e=>`<button class="chip" style="background:${C[e.cat].col}" data-a="go" data-p="ev" data-id="${e.id}">${esc(e.name)}</button>`).join('')}</div>`;
return `<div class="ch">${ic('smile',40)}<h2>Calendar</h2></div><div class="nav"><button class="btn" data-a="mo" data-n="-1" aria-label="Previous month">‹</button><b>${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="btn" data-a="mo" data-n="1" aria-label="Next month">›</button></div><div class="cg">${'MTWTFSS'.split('').map(d=>`<div class="wd">${d}</div>`).join('')}${c}</div><div class="card"><h4 style="margin-top:0">All plans</h4>${rows.map(e=>`<div class="ev">${ic(e.cat,34)}<div><a href="#" data-a="go" data-p="ev" data-id="${e.id}">${esc(e.name)}</a><br><small>${fd(e.date)}${e.end&&e.end>e.date?' → '+fd(e.end):''}${e.par?' · in '+esc(e.par):''}</small></div><a href="${e.g}" target="_blank" rel="noopener"><small>+ Google Calendar ↗</small></a></div>`).join('')||'<small>Add a date to a plan and it shows up here.</small>'}</div>`}

function render(){const y=scrollY,key=V.p+V.id+V.c;let h=hdr();
if(V.p=='home')h+=home();else if(V.p=='cat')h+=catp();else if(V.p=='cal')h+=cal();
else{const e=cur();if(!e){V={p:'home'};return render()}h+=evp(e)}
app.innerHTML=h;scrollTo(0,key==R?y:0);R=key}

app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,E=cur(),sid=(b.closest('[data-s]')||{dataset:{}}).dataset.s,i=+b.dataset.i;
if(a=='go'){ev.preventDefault();V={p:b.dataset.p,c:b.dataset.c||V.c,id:b.dataset.id}}
else if(a=='mo')V.m=new Date(V.m.getFullYear(),V.m.getMonth()+(+b.dataset.n),1);
else if(a=='newev'){let k=1;while(S.ev.some(x=>x.cat==V.c&&x.name==SG[V.c]+' '+k))k++;S.ev.push({id:uid(),cat:V.c,name:SG[V.c]+' '+k,f:{date:'',days:''},s:{}})}
else if(a=='bk'||a=='rs'){const t=$('#bkt'),m=$('#bkm');
if(a=='bk'){t.value=JSON.stringify(S);t.select();let ok=0;try{ok=document.execCommand('copy')}catch(x){}m.textContent=ok?'Copied! Paste it somewhere safe, like Notes.':'Select the text above, copy it and keep it somewhere safe.';return}
try{const j=JSON.parse(t.value);if(!Array.isArray(j.ev))throw 0;S=fixN(j)}catch(x){m.textContent='That doesn’t look like a backup.';return}}
else if(a=='tick')E.s[sid].items[i].d=b.checked;
else if(a=='del')E.s[sid].items.splice(i,1);
else if(a=='dellink')E.s[sid].links.splice(i,1);
else if(a=='add'||a=='addlink'){const o={};b.closest('.add').querySelectorAll('[name]').forEach(n=>o[n.name]=n.value.trim());
if(a=='add'){if(!o.t)return;o.d=false;E.s[sid].items.push(o)}
else{if(!o.u)return;if(!/^https?:\/\//i.test(o.u))o.u='https://'+o.u;E.s[sid].links.push(o)}}
else if(a=='dup'){const c=JSON.parse(JSON.stringify(E));c.id=uid();c.name+=' (copy)';c.f.date='';Object.values(c.s).forEach(o=>(o.items||[]).forEach(x=>x.d=false));S.ev.push(c);V={p:'ev',id:c.id,c:c.cat}}
else if(a=='delev'){if(!V.del){V.del=1}else{S.ev=S.ev.filter(x=>x.id!=E.id);V={p:'cat',c:E.cat}}}
const gg=(b.closest('.add')||{dataset:{}}).dataset.g;save();render();if(a=='add'||a=='addlink'){const f=app.querySelector(gg?`details[data-s="${sid}"] .add[data-g="${gg}"] input[name="t"]`:`details[data-s="${sid}"] .add input[name="${a=='add'?'t':'l'}"]`);if(f)f.focus()}});
app.addEventListener('input',ev=>{const t=ev.target,E=cur();if(!E||V.p!='ev')return;
if(t.dataset.f!==undefined){E.f[t.dataset.f]=t.value;if(t.dataset.f=='place'){const w=$('#wx');if(w)w.href=wxh(E)}save()}
else if(t.dataset.name!==undefined){E.name=t.value;save()}
else if(t.dataset.n!==undefined){E.s[t.dataset.n].text=t.value;save()}});
app.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.closest('.add')){const b=ev.target.closest('.add').querySelector('button');if(b)b.click()}});
app.addEventListener('toggle',ev=>{const d=ev.target;if(d.dataset&&d.dataset.k)open[d.dataset.k]=d.open},true);
render();
</script></body></html>
